<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Polymarket EV gap analysis dashboard with risk-aware position sizing.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#0B0F14">
  <meta name="color-scheme" content="dark light">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EV Desk">

  <meta name="msapplication-TileColor" content="#0B0F14">
  <meta name="msapplication-TileImage" content="icons/Icon-192.png">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Polymarket EV Desk</title>

  <style>
    html,
    body {
      background: #0B0F14;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .boot {
      align-items: center;
      color: #E6FFF9;
      display: flex;
      height: 100%;
      justify-content: center;
      letter-spacing: 0;
    }

    .boot-card {
      text-align: center;
    }

    .boot-logo {
      background: linear-gradient(135deg, #00C2A8, #52E0FF);
      border-radius: 24px;
      box-shadow: 0 16px 42px rgba(0, 194, 168, 0.24);
      height: 82px;
      margin: 0 auto 18px;
      position: relative;
      width: 82px;
    }

    .boot-logo::after {
      background: #0B0F14;
      border-radius: 10px;
      content: "";
      height: 28px;
      left: 27px;
      position: absolute;
      top: 27px;
      width: 28px;
    }

    .boot-title {
      font-size: 18px;
      font-weight: 700;
    }

    .boot-subtitle {
      color: rgba(230, 255, 249, 0.68);
      font-size: 13px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="boot" id="boot">
    <div class="boot-card">
      <div class="boot-logo"></div>
      <div class="boot-title">Polymarket EV Desk</div>
      <div class="boot-subtitle">Loading analysis workspace</div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
